name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }}
          mv app/build/outputs/apk/release/app-release.apk LightSet-0.1.${{ github.run_number }}.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" LightSet-0.1.${{ github.run_number }}.apk \
            --target "$GITHUB_SHA" \
            --title "LightSet 0.1.${{ github.run_number }}" \
            --generate-notes
